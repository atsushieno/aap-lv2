name: build

on:
  push:
  pull_request:

jobs:
  linux-build:
    name: build on linux
    runs-on: ubuntu-24.04
    steps:
    - name: checkout
      uses: actions/checkout@v4
      with:
        submodules: recursive
    - name: apt update
      run: |
        sudo apt-get update
    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: 17
        distribution: temurin
    - name: cache AVD
      uses: actions/cache@v4
      env:
        cache-name: cache-avd
      with:
        path: /home/runner/.android/gradle/avd
        key: ${{ runner.os }}-gradle-avd
    - name: cache gradle caches
      uses: actions/cache@v4
      env:
        cache-name: cache-gradle-caches
      with:
        path: /home/runner/.gradle/caches/
        key: ${{ runner.os }}-gradle-caches
    - name: apt install
      run: |
        echo y | sudo apt-get install doxygen libgrpc++-dev libgrpc-dev libprotobuf-dev protobuf-compiler protobuf-compiler-grpc graphviz cmake ninja-build liblilv-dev
    - name: build aap-core
      run: ./gradlew publishToMavenLocal
      working-directory: external/aap-core
    - name: build LV2 metadata importer
      run: |
        cmake -E rm -rf tools/aap-import-lv2-metadata/build
        cmake -S tools/aap-import-lv2-metadata -B tools/aap-import-lv2-metadata/build -G Ninja -DCMAKE_BUILD_TYPE=Debug
        cmake --build tools/aap-import-lv2-metadata/build
    - name: build
      run: ./gradlew build publishToMavenLocal
    - name: upload artifact
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: aap-lv2-apps-and-libs
        path: |
          ./*/build/outputs/aar/*.aar
          ./aap-ayumi/build/outputs/apk/debug/*.apk
          ./aap-ayumi/build/outputs/bundle/release/*.aab

  osx-build:
    name: build on osx
    runs-on: macos-14
    steps:
    - name: checkout
      uses: actions/checkout@v4
      with:
        submodules: recursive
    - name: cache AVD
      uses: actions/cache@v4
      env:
        cache-name: cache-avd
      with:
        path: /Users/runner/.android/gradle/avd
        key: ${{ runner.os }}-gradle-avd
    - name: cache gradle caches
      uses: actions/cache@v4
      env:
        cache-name: cache-gradle-caches
      with:
        path: /Users/runner/.gradle/caches/
        key: ${{ runner.os }}-gradle-caches
    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: 17
        distribution: temurin
    - name: install deps
      run: |
        brew install doxygen ninja graphviz lilv grpc
    - name: build aap-core
      run: ./gradlew publishToMavenLocal
      working-directory: external/aap-core
      env:
        ANDROID_SDK_ROOT: /Users/runner/Library/Android/sdk
    - name: build LV2 metadata importer
      run: |
        cmake -E rm -rf tools/aap-import-lv2-metadata/build
        cmake -S tools/aap-import-lv2-metadata -B tools/aap-import-lv2-metadata/build -G Ninja -DCMAKE_BUILD_TYPE=Debug
        cmake --build tools/aap-import-lv2-metadata/build
    - name: build
      run: ./gradlew build publishToMavenLocal
      env:
        ANDROID_SDK_ROOT: /Users/runner/Library/Android/sdk
