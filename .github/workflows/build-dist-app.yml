name: build dist

on:
  workflow_call:

jobs:
  linux-build:
    name: build on linux
    runs-on: ubuntu-24.04
    steps:
    - name: checkout
      uses: actions/checkout@v4
      with:
        submodules: recursive
    - name: cache AVD
      uses: actions/cache@v4
      env:
        cache-name: cache-avd
      with:
        path: /home/runner/.android/gradle/avd
        key: ${{ runner.os }}-gradle-avd
    - name: cache gradle caches
      uses: actions/cache@v4
      env:
        cache-name: cache-gradle-caches
      with:
        path: /home/runner/.gradle/caches/
        key: ${{ runner.os }}-gradle-caches
    - name: apt update
      run: |
        sudo apt-get update
    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: 17
        distribution: temurin
    - name: apt install
      run: |
        echo y | sudo apt-get install doxygen libgrpc++-dev libgrpc-dev libprotobuf-dev graphviz cmake ninja-build liblilv-dev gettext
    - name: prepare sources
      run: |
        if [ -x scripts/prepare-sources.sh ]; then
          scripts/prepare-sources.sh
        fi
    - name: build aap-core
      run: ./gradlew publishToMavenLocal
      working-directory: external/aap-lv2/external/aap-core
    - name: build aap-lv2 metadata importer
      run: |
        cmake -E rm -rf tools/aap-import-lv2-metadata/build
        cmake -S tools/aap-import-lv2-metadata -B tools/aap-import-lv2-metadata/build -G Ninja -DCMAKE_BUILD_TYPE=Debug
        cmake --build tools/aap-import-lv2-metadata/build
      working-directory: external/aap-lv2
    - name: build aap-lv2 library
      run: ./gradlew :androidaudioplugin-lv2:build :androidaudioplugin-lv2:publishToMavenLocal
      working-directory: external/aap-lv2
    - name: build
      run: ./gradlew build bundle

  osx-build:
    name: build on osx
    runs-on: macos-14
    steps:
    - name: checkout
      uses: actions/checkout@v4
      with:
        submodules: recursive
    - name: cache AVD
      uses: actions/cache@v4
      env:
        cache-name: cache-avd
      with:
        path: /Users/runner/.android/gradle/avd
        key: ${{ runner.os }}-gradle-avd
    - name: cache gradle caches
      uses: actions/cache@v4
      env:
        cache-name: cache-gradle-caches
      with:
        path: /Users/runner/.gradle/caches/
        key: ${{ runner.os }}-gradle-caches
    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: 17
        distribution: temurin
    - name: install deps
      run: |
        brew install doxygen ninja graphviz lilv gettext
    - name: prepare sources
      run: |
        if [ -x scripts/prepare-sources.sh ]; then
          scripts/prepare-sources.sh
        fi
    - name: build aap-core
      run: ./gradlew publishToMavenLocal
      working-directory: external/aap-lv2/external/aap-core
      env:
        ANDROID_SDK_ROOT: /Users/runner/Library/Android/sdk
    - name: build aap-lv2 metadata importer
      run: |
        cmake -E rm -rf tools/aap-import-lv2-metadata/build
        cmake -S tools/aap-import-lv2-metadata -B tools/aap-import-lv2-metadata/build -G Ninja -DCMAKE_BUILD_TYPE=Debug
        cmake --build tools/aap-import-lv2-metadata/build
      working-directory: external/aap-lv2
    - name: build aap-lv2 library
      run: ./gradlew :androidaudioplugin-lv2:build :androidaudioplugin-lv2:publishToMavenLocal
      working-directory: external/aap-lv2
      env:
        ANDROID_SDK_ROOT: /Users/runner/Library/Android/sdk
    - name: build
      run: ./gradlew build bundle
      env:
        ANDROID_SDK_ROOT: /Users/runner/Library/Android/sdk
    - name: upload artifact
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: debug-apk
        path: |
          ./app/build/outputs/apk/debug/*.apk
          ./app/build/outputs/bundle/release/*.aab
    - name: Create Release
      uses: ncipollo/release-action@v1.21.0
      if: success() && startsWith(github.ref, 'refs/tags/')
      with:
        artifacts: ./app/build/outputs/apk/debug/*.apk,./app/build/outputs/bundle/release/*.aab
